<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="X20 Tracker">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>X20 Tracker</title>
<style>
  :root{
    --bg-deep:#0A0D0F;
    --bg-panel:#11161A;
    --line:#1E262B;
    --accent:#5EEBA5;
    --accent-dim:#2A5C46;
    --amber:#FFB347;
    --text-primary:#E7EEEA;
    --text-secondary:#8B9A94;
    --text-tertiary:#556059;
    --danger:#FF6B6B;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;min-height:100%;background:var(--bg-deep);
    font-family:'Inter',sans-serif;color:var(--text-primary);
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{
    max-width:560px;margin:0 auto;
    padding:calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  header{ margin-bottom:18px; }
  header h1{
    font-size:20px;font-weight:700;margin:0 0 2px;
    display:flex;align-items:center;gap:8px;
  }
  header h1 .mark{ color:var(--accent); font-size:18px; }
  header .sub{ font-size:13px;color:var(--text-secondary); }

  .card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    margin-bottom:12px;
  }
  .card-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:10px;
  }
  .card-head h2{ font-size:15px;font-weight:600;margin:0; }
  .card-head .status{ font-size:11px;color:var(--text-tertiary); }

  .dep-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 0;
    border-top:1px solid var(--line);
  }
  .dep-row:first-of-type{ border-top:none; }
  .dep-time{ font-size:17px;font-weight:600; }
  .dep-time.live{ color:var(--accent); }
  .dep-time.scheduled{ color:var(--text-primary); }
  .dep-direction{ font-size:12px;color:var(--text-secondary);margin-top:2px; }
  .badge{
    font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;
    padding:3px 7px;border-radius:4px;font-weight:600;
  }
  .badge.live{ background:rgba(94,235,165,.12); color:var(--accent); }
  .badge.scheduled{ background:rgba(255,179,71,.1); color:var(--amber); }

  .empty{
    color:var(--text-tertiary);font-size:13px;padding:6px 0;
  }
  .error{
    color:var(--danger);font-size:12.5px;padding:6px 0;
  }

  footer{
    margin-top:8px;text-align:center;
    font-size:11px;color:var(--text-tertiary);
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1><span class="mark">◎</span>X20 Tracker</h1>
    <div class="sub">Stratford ⇄ Henley High School</div>
  </header>

  <div id="cards"></div>

  <footer>
    Live where available, scheduled times otherwise · updates every 60s
  </footer>
</div>

<script>
(function(){
  const STOPS = [
    { id:'henleyhs', label:'Henley High School' },
    { id:'bearley',  label:'Bearley, Oak Tree Close' },
    { id:'maybird',  label:'Stratford, Maybird Centre' },
    { id:'woodst',   label:'Stratford, Wood Street' },
  ];

  const cardsEl = document.getElementById('cards');
  const cardEls = {};

  STOPS.forEach(s=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <h2>${s.label}</h2>
        <span class="status mono" id="status-${s.id}">loading…</span>
      </div>
      <div id="deps-${s.id}"><div class="empty">Loading…</div></div>
    `;
    cardsEl.appendChild(card);
    cardEls[s.id] = card;
  });

  function fmtDisplay(d){
    // best_departure_estimate is usually already friendly ("5 mins", "due",
    // or a HH:MM), so just pass it straight through.
    return d.display || d.scheduledTime || '—';
  }

  async function loadStop(stop){
    const statusEl = document.getElementById('status-' + stop.id);
    const depsEl = document.getElementById('deps-' + stop.id);
    try{
      const res = await fetch(`/api/departures?stop=${stop.id}`);
      const data = await res.json();

      if(!data.found){
        statusEl.textContent = 'no data';
        depsEl.innerHTML = `<div class="empty">${data.reason || 'No departures found for this stop right now.'}</div>`;
        return;
      }

      statusEl.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

      if(!data.departures || data.departures.length === 0){
        depsEl.innerHTML = '<div class="empty">No upcoming X20 departures found.</div>';
        return;
      }

      depsEl.innerHTML = '';
      data.departures.forEach(d=>{
        const row = document.createElement('div');
        row.className = 'dep-row';
        row.innerHTML = `
          <div>
            <div class="dep-time mono ${d.isLive ? 'live' : 'scheduled'}">${fmtDisplay(d)}</div>
            ${d.direction ? `<div class="dep-direction">${d.direction}</div>` : ''}
          </div>
          <span class="badge ${d.isLive ? 'live' : 'scheduled'}">${d.isLive ? 'Live' : 'Scheduled'}</span>
        `;
        depsEl.appendChild(row);
      });
    }catch(err){
      statusEl.textContent = 'error';
      depsEl.innerHTML = '<div class="error">Could not reach the server. Retrying automatically.</div>';
    }
  }

  function loadAll(){
    STOPS.forEach(loadStop);
  }

  loadAll();
  setInterval(loadAll, 60000);
})();
</script>
</body>
</html>
